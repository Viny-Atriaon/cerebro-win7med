; PHP local para rodar e testar a API do start.win7.ai (php -c start/php-dev.ini -d extension_dir=<pasta ext do PHP>).
; As mesmas extensões que a HostGator tem ligadas (PHP 8.3 com openssl, mbstring, intl). O PHP do winget vem sem php.ini.
extension=openssl
extension=mbstring
extension=intl
extension=fileinfo
date.timezone=America/Sao_Paulo
memory_limit=256M
post_max_size=16M
upload_max_filesize=16M
max_execution_time=60
display_errors=Off
log_errors=On
variables_order=EGPCS
