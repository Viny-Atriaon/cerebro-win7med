# Auditoria do ambiente em execução (TEST-RUNTIME-01) do start.win7.ai, o único servidor deste projeto (ADR-008).
# Uso: bash scripts/audit-runtime.sh scripts/audit-runtime.conf [--abuse]      (npm run audit:runtime)
# Variável vazia = checagem pulada (⏭️), nunca aprovada. Pendências com prazo em docs/CONFORMIDADE.md.
RT_PROJECT="start.win7.ai (Cérebro Win7 Med)"
RT_BASE_URL="https://start.win7.ai"
RT_API_PROBE="/api/saude"
RT_HEALTH_PUBLIC="https://start.win7.ai/api/saude"
RT_HEALTH_READY="https://start.win7.ai/api/sessao"
RT_DIST_DIR="dist/start"
# defesas (convite, sessão, limites, CSRF) rodam contra uma instância descartável, nunca contra a do ar
RT_ABUSE_CMD="bash start/testes/regressao-abuso.sh"
# hospedagem compartilhada (cPanel): sem porta própria, sem worker, log de acesso só pelo painel
RT_LOOPBACK_ONLY_PORTS=""
RT_WORKER_HEARTBEAT_FILE=""
RT_ACCESS_LOG=""
# cópia diária dos projetos fica no próprio servidor (backups/AAAA-MM-DD); cópia fora da HostGator pendente (CONFORMIDADE)
RT_BACKUP_DIR=""
RT_WAIVERS=""
